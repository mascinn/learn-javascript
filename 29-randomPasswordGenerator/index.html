<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Random Password Generator</title>
</head>
<body>
    <div class="container">
        <h1>Random Password Generator</h1>
        <label for="lengthPassword">Password Length:</label>
        <input type="number" id="lengthPassword" min="1" max="20">

        <form>
            <label for="includeUppercase">Include Uppercase</label>
            <input type="checkbox" id="includeUppercase">
            <br>

            <label for="includeLowercase">Include Lowercase</label>
            <input type="checkbox" id="includeLowercase">
            <br>

            <label for="includeNumbers">Include Numbers</label>
            <input type="checkbox" id="includeNumbers">
            <br>

            <label for="includeSymbols">Include Symbols</label>
            <input type="checkbox" id="includeSymbols">
        </form>
        <br>

        <button id="generatePasswordBtn">Generate Password</button>

        <h2>Generated Password:</h2>
        <p id="result">Here is your generated password</p>
        <button id="copyPasswordBtn">Copy Password</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
